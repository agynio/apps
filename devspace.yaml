version: v2beta1

vars:
  APPS_NAMESPACE: platform

functions:
  disable_argocd_sync: |-
    if kubectl get application apps -n argocd >/dev/null 2>&1; then
      echo "Disabling ArgoCD auto-sync for apps..."
      kubectl patch application apps -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":null}}}'
      echo "ArgoCD auto-sync disabled."
    else
      echo "WARNING: ArgoCD Application 'apps' not found in argocd namespace."
    fi
  restore_argocd_sync: &restore_argocd_sync |-
    if kubectl get application apps -n argocd >/dev/null 2>&1; then
      echo "Re-enabling ArgoCD auto-sync for apps..."
      kubectl patch application apps -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
      echo "ArgoCD auto-sync restored."
    else
      echo "WARNING: ArgoCD Application 'apps' not found in argocd namespace."
    fi
  patch_deployment: |-
    echo "Patching apps deployment for DevSpace..."
    kubectl patch deployment apps -n ${APPS_NAMESPACE} --type strategic --patch "$(cat <<'EOF'
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 1000
            fsGroup: 1000
          initContainers: []
          volumes:
            - name: data
              emptyDir: {}
          containers:
            - name: apps
              image: ghcr.io/agynio/devcontainer-go:1 # dev container for source deploy
              workingDir: /opt/app/data
              env:
                - name: PATH
                  value: /go/bin:/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              command:
                - sh
                - -c
                - |
                  sleep infinity
              volumeMounts:
                - name: data
                  mountPath: /opt/app/data
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              livenessProbe:
                tcpSocket: null
                exec:
                  command:
                    - sh
                    - -c
                    - "true"
                initialDelaySeconds: 1
                periodSeconds: 10
              readinessProbe:
                tcpSocket: null
                exec:
                  command:
                    - sh
                    - -c
                    - "true"
                initialDelaySeconds: 1
                periodSeconds: 10
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                readOnlyRootFilesystem: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
    EOF
    )"

pipelines:
  dev:
    flags:
      - name: watch
        short: w
        description: "Keep DevSpace running and stream logs"
    run: |-
      disable_argocd_sync
      patch_deployment
      if [ "$(get_flag "watch")" == "true" ]; then
        start_dev --disable-pod-replace apps
      else
        start_dev --disable-pod-replace apps
        echo "Starting apps service from synced source..."
        exec_container --label-selector=app.kubernetes.io/name=apps -n ${APPS_NAMESPACE} -- bash -lc 'set -euo pipefail
          cd /opt/app/data
          buf generate buf.build/agynio/api \
            --path agynio/api/apps/v1 \
            --path agynio/api/authorization/v1 \
            --path agynio/api/identity/v1 \
            --path agynio/api/ziti_management/v1
          nohup go run ./cmd/apps-service >/tmp/apps-service.log 2>&1 &
        '
        echo "Waiting for apps to be healthy on :50051..."
        healthy=false
        for i in $(seq 1 150); do
          if exec_container --label-selector=app.kubernetes.io/name=apps -n ${APPS_NAMESPACE} -- bash -c 'nc -z localhost 50051 >/dev/null 2>&1 || (echo > /dev/tcp/localhost/50051) >/dev/null 2>&1'; then
            healthy=true
            break
          fi
          sleep 2
        done
        if [ "$healthy" != "true" ]; then
          exec_container --label-selector=app.kubernetes.io/name=apps -n ${APPS_NAMESPACE} -- bash -lc 'cat /tmp/apps-service.log >&2' || true
          echo "ERROR: Apps did not become healthy within 300s" >&2
          exit 1
        fi
        echo "Dev environment ready. Stopping dev session."
        stop_dev apps
      fi

hooks:
  - name: restore-argocd-auto-sync
    events:
      - after:dev:apps
    command: bash
    args:
      - -c
      - *restore_argocd_sync

dev:
  apps:
    namespace: ${APPS_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: apps
      app.kubernetes.io/instance: apps
    containers:
      apps:
        container: apps
        sync:
          - path: ./:/opt/app/data
            excludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
            uploadExcludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
            downloadExcludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
        logs:
          enabled: true
          lastLines: 200
    ports:
      - port: "50051"
